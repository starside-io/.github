<svg xmlns="http://www.w3.org/2000/svg" width="840" height="112" viewBox="0 0 840 112" fill="none">
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
@keyframes spin{to{transform:rotate(360deg)}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) backwards}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="planet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBC46A"/><stop offset=".45" stop-color="#F7941D"/><stop offset="1" stop-color="#FF2D3D"/></linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBC46A"/><stop offset=".5" stop-color="#F7941D"/><stop offset="1" stop-color="#FF2D3D"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7941D" stop-opacity=".7"/><stop offset=".45" stop-color="#26262B"/><stop offset="1" stop-color="#FF2D3D" stop-opacity=".35"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity=".03"/></pattern>
  <radialGradient id="fadeMask" cx=".75" cy=".1" r=".9"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gm"><rect width="840" height="112" fill="url(#fadeMask)"/></mask>
  <filter id="blur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="60"/></filter>
  <clipPath id="clip"><rect width="840" height="112" rx="18"/></clipPath>
  
</defs>
<g clip-path="url(#clip)">
  <rect width="840" height="112" fill="#0E0E10"/>
  <rect width="840" height="112" fill="url(#grid)" mask="url(#gm)"/>
  <circle cx="840" cy="56" r="140" fill="#FF2D3D" opacity=".12" filter="url(#blur)"/>
<g class="fu" style="animation-delay:.05s">
<text x="36" y="38" class="mono" font-size="12" font-weight="600" fill="#F7941D">07<tspan fill="#71717A"> /07</tspan></text>
<text x="96" y="38" class="sans" font-size="19" font-weight="700" letter-spacing="-.3" fill="#F4F4F5">Neurowire Daily</text>
<text x="36" y="66" class="sans" font-size="12.5" fill="#A1A1AA">A short audio bulletin per topic, generated every morning from the Neurowire</text>
<text x="36" y="84" class="sans" font-size="12.5" fill="#A1A1AA">feed network. Every story credited. Transcript and MP3. No signup.</text>
