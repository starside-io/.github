<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="840" height="358" viewBox="0 0 840 358" role="img" aria-label="Our values: democratizing AI, open source always, accessible by design">
<title>Our values: democratizing AI, open source always, accessible by design</title>
<style>@font-face{font-family:'S Red Hat Mono';font-weight:400;src:url(data:font/ttf;base64,) format('truetype')}.m{font-family:'S Red Hat Mono','SF Mono',Menlo,Consolas,monospace;font-weight:400}@font-face{font-family:'S Krona One';font-weight:400;src:url(data:font/ttf;base64,) format('truetype')}.d{font-family:'S Krona One','Arial Black',sans-serif;font-weight:400}@font-face{font-family:'S Red Hat Text';font-weight:400;src:url(data:font/ttf;base64,) format('truetype')}.t{font-family:'S Red Hat Text',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-weight:400}</style>
<rect x="4" y="29.6" width="18" height="5" fill="#f5b02e"/>
<rect x="28" y="29.6" width="18" height="5" fill="#f26b21"/>
<rect x="52" y="29.6" width="18" height="5" fill="#d93a26"/>
<text x="80.0" y="34.0" class="m" font-size="10.5" fill="#b6a890" letter-spacing="1.68">WHAT WE STAND FOR</text>
<text x="4.0" y="86.0" class="d" font-size="38" fill="#f2e6cf">OUR VALUES</text>
<text x="4.0" y="150.0" class="d" font-size="15.5" fill="#f5b02e">DEMOCRATIZING AI</text>
<text x="4.0" y="180.0" class="t" font-size="14.5" fill="#dccfb6">We make artificial intelligence and</text>
<text x="4.0" y="202.0" class="t" font-size="14.5" fill="#dccfb6">its uses available to everyone, not</text>
<text x="4.0" y="224.0" class="t" font-size="14.5" fill="#dccfb6">locked away behind big platforms.</text>
<rect x="271.3" y="128" width="1" height="130" fill="#3a2c22"/>
<text x="301.3" y="150.0" class="d" font-size="15.5" fill="#f26b21">OPEN SOURCE,</text>
<text x="301.3" y="172.0" class="d" font-size="15.5" fill="#f26b21">ALWAYS</text>
<text x="301.3" y="202.0" class="t" font-size="14.5" fill="#dccfb6">Powerful tooling and frameworks,</text>
<text x="301.3" y="224.0" class="t" font-size="14.5" fill="#dccfb6">all public and forkable. Read the</text>
<text x="301.3" y="246.0" class="t" font-size="14.5" fill="#dccfb6">code, change it, run your own.</text>
<rect x="568.7" y="128" width="1" height="130" fill="#3a2c22"/>
<text x="598.7" y="150.0" class="d" font-size="15.5" fill="#e8553f">ACCESSIBLE BY</text>
<text x="598.7" y="172.0" class="d" font-size="15.5" fill="#e8553f">DESIGN</text>
<text x="598.7" y="202.0" class="t" font-size="14.5" fill="#dccfb6">Built so any person or team can</text>
<text x="598.7" y="224.0" class="t" font-size="14.5" fill="#dccfb6">pick it up, customize it, and put it</text>
<text x="598.7" y="246.0" class="t" font-size="14.5" fill="#dccfb6">to work.</text>
<path d="M6 294 H192.3 A14 14 0 0 1 206.3 308 V329.8 A2 2 0 0 1 204.3 331.8 H6 A2 2 0 0 1 4 329.8 V296 A2 2 0 0 1 6 294 Z" fill="#f26b21"/>
<text x="24.0" y="316.7" class="d" font-size="10.5" fill="#0d0b0a" letter-spacing="0.42">READ OUR VALUES</text>
<path d="M175.3 312.9 H187.3 M182.8 308.4 L187.3 312.9 L182.8 317.4" fill="none" stroke="#0d0b0a" stroke-width="2" stroke-linecap="square"/>
</svg>
