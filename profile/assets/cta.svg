<svg xmlns="http://www.w3.org/2000/svg" width="840" height="150" viewBox="0 0 840 150" fill="none">
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
@keyframes spin{to{transform:rotate(360deg)}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) backwards}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="planet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBC46A"/><stop offset=".45" stop-color="#F7941D"/><stop offset="1" stop-color="#FF2D3D"/></linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBC46A"/><stop offset=".5" stop-color="#F7941D"/><stop offset="1" stop-color="#FF2D3D"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7941D" stop-opacity=".7"/><stop offset=".45" stop-color="#26262B"/><stop offset="1" stop-color="#FF2D3D" stop-opacity=".35"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity=".03"/></pattern>
  <radialGradient id="fadeMask" cx=".75" cy=".1" r=".9"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gm"><rect width="840" height="150" fill="url(#fadeMask)"/></mask>
  <filter id="blur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="60"/></filter>
  <clipPath id="clip"><rect width="840" height="150" rx="18"/></clipPath>
  
</defs>
<g clip-path="url(#clip)">
  <rect width="840" height="150" fill="#0E0E10"/>
  <rect width="840" height="150" fill="url(#grid)" mask="url(#gm)"/>
  <circle cx="840" cy="150" r="200" fill="#FF2D3D" opacity=".16" filter="url(#blur)"/>
<circle cx="380" cy="84" r="1.2" fill="#fff" style="animation:twinkle 4s ease-in-out 1.8s infinite"/><circle cx="718" cy="28" r="1.2" fill="#fff" style="animation:twinkle 4s ease-in-out 2.5s infinite"/><circle cx="666" cy="14" r="1" fill="#fff" style="animation:twinkle 4s ease-in-out 0.6s infinite"/><circle cx="453" cy="134" r="0.6" fill="#fff" style="animation:twinkle 4s ease-in-out 2.4s infinite"/><circle cx="333" cy="68" r="0.8" fill="#fff" style="animation:twinkle 4s ease-in-out 2.5s infinite"/><circle cx="699" cy="9" r="0.6" fill="#fff" style="animation:twinkle 4s ease-in-out 0.8s infinite"/><circle cx="203" cy="5" r="1.2" fill="#fff" style="animation:twinkle 4s ease-in-out 1.3s infinite"/><circle cx="496" cy="29" r="0.8" fill="#fff" style="animation:twinkle 4s ease-in-out 2.6s infinite"/><circle cx="420" cy="99" r="1.2" fill="#fff" style="animation:twinkle 4s ease-in-out 2.6s infinite"/><circle cx="342" cy="83" r="0.6" fill="#fff" style="animation:twinkle 4s ease-in-out 2.8s infinite"/><circle cx="265" cy="34" r="1" fill="#fff" style="animation:twinkle 4s ease-in-out 0.1s infinite"/><circle cx="473" cy="16" r="0.6" fill="#fff" style="animation:twinkle 4s ease-in-out 3.4s infinite"/><circle cx="325" cy="144" r="0.6" fill="#fff" style="animation:twinkle 4s ease-in-out 0.9s infinite"/><circle cx="779" cy="8" r="1.2" fill="#fff" style="animation:twinkle 4s ease-in-out 3.9s infinite"/><circle cx="334" cy="11" r="0.8" fill="#fff" style="animation:twinkle 4s ease-in-out 3.1s infinite"/><circle cx="227" cy="13" r="1" fill="#fff" style="animation:twinkle 4s ease-in-out 0.1s infinite"/><circle cx="344" cy="138" r="0.8" fill="#fff" style="animation:twinkle 4s ease-in-out 1.0s infinite"/><circle cx="85" cy="9" r="1.2" fill="#fff" style="animation:twinkle 4s ease-in-out 0.7s infinite"/><circle cx="470" cy="67" r="0.8" fill="#fff" style="animation:twinkle 4s ease-in-out 3.9s infinite"/><circle cx="646" cy="63" r="1.2" fill="#fff" style="animation:twinkle 4s ease-in-out 0.5s infinite"/><circle cx="353" cy="32" r="1" fill="#fff" style="animation:twinkle 4s ease-in-out 3.5s infinite"/><circle cx="819" cy="89" r="0.6" fill="#fff" style="animation:twinkle 4s ease-in-out 0.8s infinite"/>
<g class="fu" style="animation-delay:.05s"><clipPath id="plc"><circle cx="72" cy="75" r="36"/></clipPath>
<circle cx="72" cy="75" r="36" fill="url(#planet)"/>
<g clip-path="url(#plc)" opacity=".35"><path d="M36.0 64.2 C50.4 53.4 61.2 67.8 75.6 57.0 S97.2 46.2 108.0 53.4 L108.0 39.0 L36.0 39.0 Z" fill="#FBC46A"/><path d="M36.0 82.2 C54.0 75.0 64.8 89.4 82.8 78.6 S100.8 71.4 108.0 78.6 L108.0 87.6 C93.6 84.0 82.8 96.6 64.8 89.4 S43.2 93.0 36.0 93.0 Z" fill="#FBC46A"/><path d="M36.0 102.0 C57.6 96.6 72.0 107.4 108.0 98.4 L108.0 111.0 L36.0 111.0 Z" fill="#FBC46A"/></g>
<circle cx="94.3" cy="56.3" r="3.2" fill="#FB6A2C" opacity=".85"/>
<circle cx="79.9" cy="75.7" r="3.6" fill="#FB6A2C" opacity=".85"/>
<text x="132" y="66" class="sans" font-size="26" font-weight="800" letter-spacing="-.8" fill="#F4F4F5">Build <tspan fill="url(#hot)">with us</tspan></text>
<text x="132" y="92" class="sans" font-size="13" fill="#A1A1AA">A small open source initiative. Issues, forks and ideas all welcome.</text></g>
<g class="fu" style="animation-delay:.15s">
<rect x="612" y="40" width="192" height="30" rx="15" fill="#F7941D" fill-opacity=".12" stroke="#F7941D" stroke-opacity=".55"/>
<text x="708" y="59.5" text-anchor="middle" class="mono" font-size="12" fill="#FBC46A">hello@starside.io</text>
<rect x="612" y="80" width="192" height="30" rx="15" fill="#111113" stroke="#26262B"/>
<text x="708" y="99.5" text-anchor="middle" class="mono" font-size="12" fill="#A1A1AA">browse the code ↗</text></g>
</g>
