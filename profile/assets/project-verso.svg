<svg xmlns="http://www.w3.org/2000/svg" width="280" height="210" viewBox="0 0 280 210" fill="none">
<style>
.sans{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif} .mono{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.8}}
@keyframes spin{to{transform:rotate(360deg)}}
.fu{animation:fadeUp .7s cubic-bezier(.2,.7,.2,1) backwards}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <linearGradient id="planet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBC46A"/><stop offset=".45" stop-color="#F7941D"/><stop offset="1" stop-color="#FF2D3D"/></linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBC46A"/><stop offset=".5" stop-color="#F7941D"/><stop offset="1" stop-color="#FF2D3D"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7941D" stop-opacity=".7"/><stop offset=".45" stop-color="#26262B"/><stop offset="1" stop-color="#FF2D3D" stop-opacity=".35"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#FFFFFF" stroke-opacity=".03"/></pattern>
  <radialGradient id="fadeMask" cx=".75" cy=".1" r=".9"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gm"><rect width="272" height="210" fill="url(#fadeMask)"/></mask>
  <filter id="blur" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="60"/></filter>
  <clipPath id="clip"><rect width="272" height="210" rx="18"/></clipPath>
  
</defs>
<g clip-path="url(#clip)">
  <rect width="272" height="210" fill="#0E0E10"/>
  <rect width="272" height="210" fill="url(#grid)" mask="url(#gm)"/>
  <g class="fu" style="animation-delay:0.05s"><circle cx="272" cy="0" r="90" fill="#F7941D" opacity=".12" filter="url(#blur)"/>
<text x="22" y="36" class="mono" font-size="12" font-weight="600" fill="#F7941D">04<tspan fill="#71717A"> /07</tspan></text>
<text x="22" y="74" class="sans" font-size="19" font-weight="700" letter-spacing="-.3" fill="#F4F4F5">Verso</text>
<text x="22" y="100" class="sans" font-size="12.5" fill="#A1A1AA">Write a deck as plain JSON, render it</text><text x="22" y="118" class="sans" font-size="12.5" fill="#A1A1AA">as HTML, tailor one deck to many</text><text x="22" y="136" class="sans" font-size="12.5" fill="#A1A1AA">audiences. Export PDF, HTML or PNG.</text>
<rect x="22.0" y="168" width="81.0" height="22" rx="11.0" fill="#16161A" stroke="#26262B"/><text x="62.5" y="182.8" text-anchor="middle" class="mono" font-size="10.5" fill="#A1A1AA">TypeScript</text><rect x="109.0" y="168" width="99.9" height="22" rx="11.0" fill="#16161A" stroke="#26262B"/><text x="158.9" y="182.8" text-anchor="middle" class="mono" font-size="10.5" fill="#A1A1AA">Presentations</text></g>
</g>
<rect x=".5" y=".5" width="271" height="209" rx="17.5" stroke="url(#edge)"/>
</svg>
